<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タヴァーン＆レター 〜調合師の宿屋生活〜</title>
    <!-- Tailwind CSS for Modern UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js (3D Graphics Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Shippori Mincho', serif;
            user-select: none;
            background-color: #0d0a08;
            color: #e2d7c5;
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .pointer-active {
            pointer-events: auto;
        }

        /* Medieval Parchment Container */
        .parchment {
            background: linear-gradient(135deg, #2a1f18 0%, #1c1410 100%);
            border: 2px solid #8c6d46;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.9);
            color: #e2d7c5;
        }

        .btn-medieval {
            background: linear-gradient(180deg, #6e4e2b 0%, #4a331a 100%);
            border: 1px solid #b8925b;
            color: #fce8cd;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .btn-medieval:hover {
            background: linear-gradient(180deg, #876137 0%, #5d4122 100%);
            border-color: #ffd285;
            transform: translateY(-1px);
        }

        .btn-medieval:active {
            transform: translateY(1px);
        }

        /* Reticle / Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 235, 205, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        #crosshair.active {
            width: 16px;
            height: 16px;
            background-color: rgba(255, 215, 0, 0.9);
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffd700;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1410;
        }
        ::-webkit-scrollbar-thumb {
            background: #6e4e2b;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        
        <!-- Crosshair in First-Person View -->
        <div id="crosshair"></div>

        <!-- Target Interaction Tooltip -->
        <div id="interaction-prompt" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-black/80 text-amber-200 px-6 py-2 rounded-full border border-amber-600/50 text-sm tracking-widest hidden transition-all duration-200">
            <span class="font-bold text-yellow-400 mr-2">[E]</span><span id="prompt-text">調べる</span>
        </div>

        <!-- HUD Header (Status & Time) -->
        <div id="hud-ui" class="absolute top-4 left-4 right-4 flex justify-between items-center transition-opacity duration-500 opacity-0 pointer-none">
            <div class="parchment px-4 py-2 rounded-lg flex items-center gap-4 text-xs md:text-sm border-amber-800/60">
                <div><i class="fa-solid fa-sun text-yellow-500 mr-1"></i><span id="hud-time">1日目 - 昼</span></div>
                <div><i class="fa-solid fa-coins text-amber-400 mr-1"></i><span id="hud-gold" class="text-amber-300 font-bold">50 G</span></div>
            </div>

            <div class="parchment px-4 py-2 rounded-lg flex items-center gap-4 text-xs md:text-sm border-amber-800/60">
                <div class="text-amber-200"><i class="fa-solid fa-house text-amber-400 mr-1"></i><span id="location-name">自室・調合所</span></div>
            </div>
        </div>

        <!-- Controls Guide (Bottom Left) -->
        <div id="controls-guide" class="absolute bottom-4 left-4 parchment p-3 rounded-lg text-xs opacity-70 border-amber-900/40">
            <p><span class="text-amber-400 font-bold">W/A/S/D</span> : ゆったり移動</p>
            <p><span class="text-amber-400 font-bold">マウス</span> : 視点操作</p>
            <p><span class="text-amber-400 font-bold">Eキー</span> : 対象を調べる/使う</p>
            <p><span class="text-amber-400 font-bold">ESC</span> : マウスロック解除</p>
        </div>

        <!-- TITLE SCREEN -->
        <div id="title-screen" class="absolute inset-0 bg-black/90 flex flex-col justify-center items-center pointer-active transition-opacity duration-700 z-50">
            <div class="text-center max-w-lg px-6 parchment p-8 rounded-xl border-2 border-amber-600/70 shadow-2xl">
                <h1 class="text-3xl md:text-4xl font-bold text-amber-300 mb-2 tracking-widest">タヴァーン＆レター</h1>
                <p class="text-amber-100/70 text-sm mb-6">〜調合師の宿屋生活〜</p>
                <div class="text-left text-xs text-amber-200/80 mb-6 bg-black/40 p-4 rounded border border-amber-900/50 space-y-2">
                    <p>🌿 **薬草を仕入れ大釜でポーションを調合**</p>
                    <p>🎃 **隣の酒場でジャック店主に売却して金策**</p>
                    <p>🎙️ **夜は自室で「声（音声）」で日記を記録**</p>
                    <p>☀️ **窓から青空が広がる一人称3Dライフ**</p>
                </div>
                <button onclick="startGame()" class="btn-medieval w-full py-3 rounded-lg font-bold text-lg tracking-wider">
                    <i class="fa-solid fa-door-open mr-2"></i>部屋に入る (ゲーム開始)
                </button>
            </div>
        </div>

        <!-- MODAL WINDOW CONTAINER -->
        <div id="modal-container" class="absolute inset-0 bg-black/70 flex justify-center items-center hidden pointer-active z-40">
            <div id="modal-content" class="parchment w-11/12 max-w-2xl p-6 rounded-xl border border-amber-600/80 max-h-[85vh] overflow-y-auto relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-amber-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div id="modal-body">
                    <!-- Dynamic Modal Content Injection -->
                </div>
            </div>
        </div>

    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        /* --------------------------------------------------
         * GAME STATE & VARIABLES
         * -------------------------------------------------- */
        const gameState = {
            gold: 50,
            day: 1,
            timeOfDay: 'day', // 'day', 'sunset', 'night'
            currentLocation: 'room', // 'room' or 'tavern'
            inventory: {
                herb_red: 3,
                herb_blue: 2,
                clean_water: 4,
                empty_bottle: 3,
                potion_health: 0,
                potion_mana: 0,
                potion_elixir: 0
            },
            journalEntries: []
        };

        // 3D Engine Variables
        let scene, camera, renderer;
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;

        // Player Motion Controls
        const moveState = { forward: false, backward: false, left: false, right: false };
        const walkSpeed = 0.08; // Comfortable relaxed walking speed

        // Audio System (Footsteps & SFX via Web Audio API)
        let audioCtx = null;
        let lastStepTime = 0;

        // Raycasting for object interaction
        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);
        let currentTarget = null;
        const interactableObjects = [];

        // Animation Timers
        let cauldronWater;
        let fireplaceParticles = [];
        let tavernFireplaceParticles = [];

        /* --------------------------------------------------
         * AUDIO SYSTEM (Web Audio Synthesizer)
         * -------------------------------------------------- */
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playFootstepSE() {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastStepTime < 450) return;
            lastStepTime = now;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playBubbleSE() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            const freq = 400 + Math.random() * 300;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq + 150, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        /* --------------------------------------------------
         * THREE.JS 3D WORLD BUILDER
         * -------------------------------------------------- */
        function init3DWorld() {
            const container = document.getElementById('webgl-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0806);
            scene.fog = new THREE.FogExp2(0x0a0806, 0.025);

            // Camera
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);

            buildInnRoom();
            buildTavernArea();
        }

        // Texture Generators
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4a321a'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#372310';
            for (let i = 0; i < 256; i += 16) {
                ctx.fillRect(i, 0, 2, 256);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2b2622'; ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#181513'; ctx.lineWidth = 4;
            for (let y = 0; y < 256; y += 32) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6e1d18'; ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#c29b47'; ctx.lineWidth = 12;
            ctx.strokeRect(16, 16, 224, 224);
            ctx.lineWidth = 4;
            ctx.strokeRect(32, 32, 192, 192);
            ctx.beginPath();
            ctx.moveTo(128, 64); ctx.lineTo(192, 128); ctx.lineTo(128, 192); ctx.lineTo(64, 128);
            ctx.closePath();
            ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        /* --------------------------------------------------
         * INN ROOM CREATION
         * -------------------------------------------------- */
        function buildInnRoom() {
            const woodMat = new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.8 });
            const stoneMat = new THREE.MeshStandardMaterial({ map: createStoneTexture(), roughness: 0.9 });
            const carpetMat = new THREE.MeshStandardMaterial({ map: createCarpetTexture(), roughness: 0.8 });
            const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x2b1c10, roughness: 0.7 });
            const brassMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.7, roughness: 0.3 });
            const paperMat = new THREE.MeshStandardMaterial({ color: 0xded2b8, roughness: 0.9 });

            const roomGroup = new THREE.Group();
            roomGroup.position.set(0, 0, 0);

            // Floor & Ceiling
            const floorGeo = new THREE.PlaneGeometry(8, 8);
            const floor = new THREE.Mesh(floorGeo, woodMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            const rug = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.4), carpetMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.01, 0);
            roomGroup.add(rug);

            const ceiling = new THREE.Mesh(floorGeo, darkWoodMat);
            ceiling.position.y = 3.5;
            ceiling.rotation.x = Math.PI / 2;
            roomGroup.add(ceiling);

            // Walls
            const wallGeo = new THREE.PlaneGeometry(8, 3.5);
            
            const backWall = new THREE.Mesh(wallGeo, stoneMat);
            backWall.position.set(0, 1.75, -4);
            roomGroup.add(backWall);

            const frontWall = new THREE.Mesh(wallGeo, stoneMat);
            frontWall.position.set(0, 1.75, 4);
            frontWall.rotation.y = Math.PI;
            roomGroup.add(frontWall);

            const leftWall = new THREE.Mesh(wallGeo, stoneMat);
            leftWall.position.set(-4, 1.75, 0);
            leftWall.rotation.y = Math.PI / 2;
            roomGroup.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, stoneMat);
            rightWall.position.set(4, 1.75, 0);
            rightWall.rotation.y = -Math.PI / 2;
            roomGroup.add(rightWall);

            /* --- HOLLOW FIREPLACE WITH RISING FLAME PARTICLES --- */
            const fireplaceGroup = new THREE.Group();
            fireplaceGroup.position.set(-3.6, 0, 0);
            fireplaceGroup.rotation.y = Math.PI / 2;

            const mantleMat = new THREE.MeshStandardMaterial({ color: 0x221c18, roughness: 0.9 });

            // Fireplace frame walls (creates hollow fireplace interior)
            const sideLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.4, 0.3), mantleMat);
            sideLeft.position.set(-0.75, 0.7, 0.15);
            const sideRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.4, 0.3), mantleMat);
            sideRight.position.set(0.75, 0.7, 0.15);
            const topMantle = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.4), mantleMat);
            topMantle.position.set(0, 1.35, 0.15);
            const backMantle = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.1), new THREE.MeshBasicMaterial({ color: 0x0a0502 }));
            backMantle.position.set(0, 0.6, -0.05);

            fireplaceGroup.add(sideLeft, sideRight, topMantle, backMantle);

            const logMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
            const log1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7), logMat);
            log1.rotation.z = Math.PI / 3;
            log1.position.set(-0.15, 0.15, 0.15);
            const log2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7), logMat);
            log2.rotation.z = -Math.PI / 3;
            log2.position.set(0.15, 0.15, 0.15);
            fireplaceGroup.add(log1, log2);

            const fireLight = new THREE.PointLight(0xff6600, 3.5, 7);
            fireLight.position.set(0, 0.5, 0.25);
            fireplaceGroup.add(fireLight);

            // Rising Fire Flame Particles
            const particleCount = 45;
            const pGeo = new THREE.SphereGeometry(0.04, 6, 6);
            const pColors = [0xff2200, 0xff7700, 0xffcc00, 0xffea00];
            fireplaceParticles = []; // Reset array
            for (let i = 0; i < particleCount; i++) {
                const pMat = new THREE.MeshBasicMaterial({ 
                    color: pColors[Math.floor(Math.random() * pColors.length)], 
                    transparent: true, 
                    opacity: 0.95 
                });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set((Math.random() - 0.5) * 0.5, 0.15 + Math.random() * 0.5, 0.15 + (Math.random() - 0.5) * 0.15);
                p.userData = { speedY: 0.012 + Math.random() * 0.015, initialY: 0.15 };
                fireplaceGroup.add(p);
                fireplaceParticles.push(p);
            }
            roomGroup.add(fireplaceGroup);

            /* --- Furniture & Interactive Objects --- */

            // 1. BED
            const bedGroup = new THREE.Group();
            bedGroup.position.set(-2.8, 0.4, -2.5);
            const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2.5), darkWoodMat);
            const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 2.3), new THREE.MeshStandardMaterial({ color: 0xe8e0d5 }));
            mattress.position.y = 0.3;
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0xc95947 }));
            pillow.position.set(0, 0.55, -0.8);
            bedGroup.add(bedFrame, mattress, pillow);
            bedGroup.name = "ベッド (就寝)";
            bedGroup.userData = { action: 'sleep' };
            roomGroup.add(bedGroup);
            interactableObjects.push(bedGroup);

            // 2. ALCHEMY DESK
            const deskGroup = new THREE.Group();
            deskGroup.position.set(2.5, 0, -2.5);
            const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 1.4), darkWoodMat);
            deskTop.position.y = 0.4;
            deskGroup.add(deskTop);

            const cauldronMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.3 });
            const cauldron = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 0.5, 16), cauldronMat);
            cauldron.position.set(-0.5, 1.05, 0);
            
            const waterMat = new THREE.MeshBasicMaterial({ color: 0x33ff88, transparent: true, opacity: 0.85 });
            cauldronWater = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.05, 16), waterMat);
            cauldronWater.position.set(-0.5, 1.25, 0);
            deskGroup.add(cauldron, cauldronWater);

            const cauldronLight = new THREE.PointLight(0x33ff88, 1.8, 3);
            cauldronLight.position.set(-0.5, 1.4, 0);
            deskGroup.add(cauldronLight);

            const redBottle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0xff3333, transparent: true, opacity: 0.8 }));
            redBottle.position.set(0.3, 0.9, -0.3);
            const blueBottle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0x3388ff, transparent: true, opacity: 0.8 }));
            blueBottle.position.set(0.5, 0.9, -0.2);
            const greenBottle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0x33ff66, transparent: true, opacity: 0.8 }));
            greenBottle.position.set(0.4, 0.9, -0.4);

            const scaleBase = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.3), brassMat);
            scaleBase.position.set(0.4, 0.95, 0.3);
            const scaleBar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.02), brassMat);
            scaleBar.position.set(0.4, 1.1, 0.3);
            deskGroup.add(redBottle, blueBottle, greenBottle, scaleBase, scaleBar);

            deskGroup.name = "大釜 (ポーション調合)";
            deskGroup.userData = { action: 'alchemy' };
            roomGroup.add(deskGroup);
            interactableObjects.push(deskGroup);

            // 3. JOURNAL DESK
            const journalDeskGroup = new THREE.Group();
            journalDeskGroup.position.set(2.5, 0, 1.5);
            const jDeskTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 1.2), darkWoodMat);
            jDeskTop.position.y = 0.4;

            const book = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x73281d }));
            book.position.set(0, 0.84, 0);

            const paper1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.01, 0.45), paperMat);
            paper1.position.set(-0.4, 0.81, 0.1);
            paper1.rotation.y = 0.2;

            const scroll = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35), paperMat);
            scroll.rotation.z = Math.PI / 2;
            scroll.position.set(-0.3, 0.84, 0.3);

            const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3), new THREE.MeshStandardMaterial({ color: 0xfffaed }));
            candle.position.set(0.5, 0.95, 0.2);
            const candleLight = new THREE.PointLight(0xffaa44, 2, 4);
            candleLight.position.set(0.5, 1.2, 0.2);

            journalDeskGroup.add(jDeskTop, book, paper1, scroll, candle, candleLight);
            journalDeskGroup.name = "日記帳 (音声入力)";
            journalDeskGroup.userData = { action: 'journal' };
            roomGroup.add(journalDeskGroup);
            interactableObjects.push(journalDeskGroup);

            // 4. DOOR TO TAVERN
            const doorGroup = new THREE.Group();
            doorGroup.position.set(0, 0, 3.9);
            const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.6, 0.2), darkWoodMat);
            doorFrame.position.y = 1.3;
            const doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.08), brassMat);
            doorHandle.position.set(0.4, 1.2, -0.15);
            doorGroup.add(doorFrame, doorHandle);

            doorGroup.name = "重厚な木製ドア (酒場へ移動)";
            doorGroup.userData = { action: 'door_to_tavern' };
            roomGroup.add(doorGroup);
            interactableObjects.push(doorGroup);

            /* --- 5. WINDOW WITH VIBRANT BLUE SKY & CLOUDS --- */
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 0.25), darkWoodMat);
            windowFrame.position.set(0, 2.0, -3.9);
            roomGroup.add(windowFrame);

            const skyCanvas = document.createElement('canvas');
            skyCanvas.width = 512; skyCanvas.height = 512;
            const skyCtx = skyCanvas.getContext('2d');
            
            // Clear Blue Gradient
            const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
            skyGrad.addColorStop(0, '#1e70d4');
            skyGrad.addColorStop(1, '#7ec0ee');
            skyCtx.fillStyle = skyGrad;

        /* --------------------------------------------------
         * CONTROLS & CAMERA MOTION & TELEPORTATION
         * -------------------------------------------------- */
        function safeRequestPointerLock() {
            const modal = document.getElementById('modal-container');
            if (modal && !modal.classList.contains('hidden')) return;
            try {
                document.body.requestPointerLock();
            } catch (e) {
                console.warn("Pointer lock request ignored by browser security policy.", e);
            }
        }

        function setupPointerLock() {
            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === document.body);
            });

            // Click canvas to regain pointer lock seamlessly
            document.getElementById('webgl-container').addEventListener('click', () => {
                safeRequestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                const sensitivity = 0.0022;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                const maxPitch = Math.PI / 2.5;
                pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });
        }

        function setupKeyboardMovement() {
            window.addEventListener('keydown', (e) => {
                initAudio();
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = true;

                if (e.code === 'KeyE') {
                    triggerInteraction();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = false;
            });
        }

        function updatePlayerPosition() {
            if (!isPointerLocked) return;

            const dir = new THREE.Vector3();
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const side = new THREE.Vector3(-1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            let isMoving = false;

            if (moveState.forward) { dir.add(forward); isMoving = true; }
            if (moveState.backward) { dir.sub(forward); isMoving = true; }
            if (moveState.left) { dir.add(side); isMoving = true; }
            if (moveState.right) { dir.sub(side); isMoving = true; }

            if (isMoving) {
                dir.normalize().multiplyScalar(walkSpeed);
                camera.position.add(dir);
                playFootstepSE();

                if (gameState.currentLocation === 'room') {
                    camera.position.x = Math.max(-3.5, Math.min(3.5, camera.position.x));
                    camera.position.z = Math.max(-3.5, Math.min(3.5, camera.position.z));
                } else {
                    camera.position.x = Math.max(992, Math.min(1008, camera.position.x));
                    camera.position.z = Math.max(-7, Math.min(7, camera.position.z));
                }
            }
        }

        function checkRaycast() {
            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(interactableObjects, true);

            const prompt = document.getElementById('interaction-prompt');
            const crosshair = document.getElementById('crosshair');

            if (intersects.length > 0 && intersects[0].distance < 3.5) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.action && obj.parent) {
                    obj = obj.parent;
                }

                if (obj && obj.userData.action) {
                    currentTarget = obj;
                    document.getElementById('prompt-text').textContent = obj.name || "調べる";
                    prompt.classList.remove('hidden');
                    crosshair.classList.add('active');
                    return;
                }
            }

            currentTarget = null;
            prompt.classList.add('hidden');
            crosshair.classList.remove('active');
        }

        function triggerInteraction() {
            if (!currentTarget || !currentTarget.userData.action) return;
            const action = currentTarget.userData.action;

            if (action === 'door_to_tavern') {
                teleportTo('tavern');
                return;
            } else if (action === 'door_to_room') {
                teleportTo('room');
                return;
            }

            // Exit pointer lock only when opening modal dialogs
            if (document.pointerLockElement) {
                document.exitPointerLock();
            }

            if (action === 'journal') openJournalModal();
            else if (action === 'alchemy') openAlchemyModal();
            else if (action === 'tavern_counter') openTavernModal();
            else if (action === 'sleep') performSleep();
        }

        function startGame() {
            initAudio();
            document.getElementById('title-screen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('title-screen').classList.add('pointer-events-none');
                document.getElementById('hud-ui').classList.remove('opacity-0');
                safeRequestPointerLock();
            }, 500);
        }

        function teleportTo(location) {
            gameState.currentLocation = location;
            const locName = document.getElementById('location-name');
            if (location === 'tavern') {
                camera.position.set(1000, 1.6, 6);
                yaw = Math.PI;
                if (locName) locName.textContent = "中世酒場 (ジャック店主)";
            } else {
                camera.position.set(0, 1.6, 2.5);
                yaw = 0;
                if (locName) locName.textContent = "自室・調合所";
            }
            pitch = 0;
            updateHUD();
            // Maintain lock smoothly on door transition
            safeRequestPointerLock();
        }

        let recognition = null;
        let isRecording = false;

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("お使いのブラウザは音声認識機能に対応していません。キーボード入力をご利用ください。");
                return;
            }

            const btnText = document.getElementById('speech-btn-text');

            if (!isRecording) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = true;
                recognition.continuous = true;

                recognition.onresult = (event) => {
                    let text = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        text += event.results[i][0].transcript;
                    }
                    document.getElementById('journal-input').value = text;
                };

                recognition.onerror = (err) => {
                    console.error("Speech Recognition Error:", err);
                };

                recognition.start();
                isRecording = true;
                if (btnText) btnText.textContent = "🎙️ 録音中... (タップで停止)";
            } else {
                if (recognition) recognition.stop();
                isRecording = false;
                if (btnText) btnText.textContent = "音声入力 開始";
            }
        }

            const textarea = document.getElementById('journal-input');

            if (!text) return;

            gameState.journalEntries.unshift({

                text: text
            });

            closeModal();
        }

            let inv = gameState.inventory;

                    inv.herb_red -= 2; inv.clean_water -= 1; inv.empty_bottle -= 1;
                    inv.potion_health += 1;
                    playBubbleSE();

                    inv.herb_blue -= 2; inv.clean_water -= 1; inv.empty_bottle -= 1;

                            <button onclick="buyItem('empty_bottle', 2)" class="btn-medieval px-3 py-1 rounded">購入</button>
                        </div>
                    </div>

                    <!-- Sell Potions -->
                    <div class="bg-black/40 p-3 rounded border border-amber-900/40 space-y-2">
                        <p class="text-amber-400 font-bold border-b border-amber-900/50 pb-1">【完成品の売却】</p>
                        <div class="flex justify-between items-center">
                            <span>赤ポーション (${gameState.inventory.potion_health}個 / 25G)</span>
                            <button onclick="sellItem('potion_health', 25)" class="btn-medieval px-3 py-1 rounded">売却</button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span>青ポーション (${gameState.inventory.potion_mana}個 / 35G)</span>
                            <button onclick="sellItem('potion_mana', 35)" class="btn-medieval px-3 py-1 rounded">売却</button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span>万能薬 (${gameState.inventory.potion_elixir}個 / 70G)</span>
                            <button onclick="sellItem('potion_elixir', 70)" class="btn-medieval px-3 py-1 rounded">売却</button>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
        }

        function buyItem(item, price) {
            if (gameState.gold >= price) {
                gameState.gold -= price;
                gameState.inventory[item] += 1;
                updateHUD();
                openTavernModal();
            }
        }

        function sellItem(item, price) {
            if (gameState.inventory[item] > 0) {
                gameState.inventory[item] -= 1;
                gameState.gold += price;
                updateHUD();
                openTavernModal();
            }
        }

        /* 4. SLEEP FUNCTION */
        function performSleep() {
            gameState.day += 1;
            gameState.gold = Math.max(0, gameState.gold - 10); // Inn fee
            updateHUD();

            const html = `
                <div class="text-center py-6">
                    <h2 class="text-3xl font-bold text-amber-300 mb-4"><i class="fa-solid fa-moon text-yellow-400 mr-2"></i>就寝</h2>
                    <p class="text-amber-200 mb-2">一日が終わりました。宿泊費 (10 G) を支払いました。</p>
                    <p class="text-xl text-yellow-400 font-bold mb-6">${gameState.day} 日目の朝を迎えました。</p>
                    <button onclick="closeModal()" class="btn-medieval px-8 py-3 rounded-lg font-bold text-base">起きる</button>
                </div>
            `;
            openModal(html);
        }

        function updateHUD() {
            document.getElementById('hud-time').textContent = `${gameState.day}日目 - 昼`;
            document.getElementById('hud-gold').textContent = `${gameState.gold} G`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* --------------------------------------------------
         * MAIN ANIMATION RENDER LOOP
         * -------------------------------------------------- */
        function animate() {
            requestAnimationFrame(animate);

            updatePlayerPosition();
            checkRaycast();

            // Animate Fireplace Particles in Inn Room
            for (let p of fireplaceParticles) {
                p.position.y += p.userData.speedY;
                if (p.position.y > 1.2) {
                    p.position.y = p.userData.initialY;
                }
            }

            // Animate Fireplace Particles in Tavern Area
            for (let p of tavernFireplaceParticles) {
                p.position.y += p.userData.speedY;
                if (p.position.y > 1.8) {
                    p.position.y = p.userData.initialY;
                }
            }

            // Animate Cauldron Water Wave
            if (cauldronWater) {
                cauldronWater.rotation.y += 0.02;
            }

            renderer.render(scene, camera);
        }

        /* --------------------------------------------------
         * INITIALIZATION ON WINDOW LOAD
         * -------------------------------------------------- */
        window.onload = function() {
            init3DWorld();
            setupPointerLock();
            setupKeyboardMovement();
            animate();
        };
    </script>
</body>
</html>
